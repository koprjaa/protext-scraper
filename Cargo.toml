[package]
name = "protext-scraper"
version = "1.0.0"
edition = "2021"
description = "Downloads Protext.cz press releases for competitive intelligence research."
license = "MIT"
authors = ["Jan Alexandr Kopřiva <jan.alexandr.kopriva@gmail.com>"]
repository = "https://github.com/koprjaa/protext-scraper"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks", "gzip", "brotli", "deflate"] }
scraper = "0.24"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
rand = "0.8"
chardetng = "0.1"
encoding_rs = "0.8"
chrono = "0.4"
ctrlc = "3"
roxmltree = "0.21"

[dev-dependencies]
tempfile = "3"
